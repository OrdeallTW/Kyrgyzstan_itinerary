<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kyrgyzstan 8D Itinerary</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root{--bg:#f7f7f5;--surface:#fff;--text:#252525;--muted:#6f6f6b;--border:#deded9;--hike:#2f7d59;--horse:#b66a2c;--active:#f0eee8;--shadow:0 6px 24px rgba(30,30,25,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}main{width:min(1050px,calc(100% - 32px));margin:42px auto;padding:30px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
    header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}h1,h2,p{margin:0}h1{font-size:clamp(24px,4vw,38px);letter-spacing:-.02em}.sub{color:var(--muted);margin-top:4px}.metrics,.legend{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--active);font-size:14px;white-space:nowrap}
    .route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;margin:28px 0 16px}.stop{position:relative;min-width:0}.stop:not(:nth-child(4)):not(:last-child)::after{content:"";position:absolute;top:29px;left:100%;width:18px;height:2px;background:var(--border)}.day{width:100%;min-height:86px;padding:13px 14px;border:1px solid var(--border);border-left-width:5px;border-radius:12px;background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}.day:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(30,30,25,.08)}.day:focus-visible{outline:3px solid rgba(47,125,89,.3);outline-offset:2px}.day[aria-pressed="true"]{background:var(--active);box-shadow:0 3px 12px rgba(30,30,25,.08)}.day[data-kind="hike"]{border-left-color:var(--hike)}.day[data-kind="horse"]{border-left-color:var(--horse)}.day[data-kind="transfer"]{border-left-color:var(--muted)}.day strong,.day span{display:block}.day strong{font-size:15px}.day span{color:var(--muted);font-size:13px;margin-top:3px}
    .legend{color:var(--muted);font-size:13px;margin-bottom:16px}.key{display:inline-flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.dot.hike{background:var(--hike)}.dot.horse{background:var(--horse)}.detail{padding:22px;border:1px solid var(--border);border-radius:14px}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}.detail h2{font-size:21px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}.fact strong{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.route-text{color:var(--muted);margin-top:3px}footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
    .map-wrap{margin:0 0 18px}.map-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.map-head h2{font-size:18px}.map-note{color:var(--muted);font-size:12px}.map{height:420px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#dfe8dc}.map-pin{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--hike);color:#fff;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.28);font:700 13px/1 Inter,system-ui,sans-serif}.map-pin.horse{background:var(--horse)}.map-pin.transfer{background:#6f6f6b}.leaflet-popup-content{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}.leaflet-popup-content strong{display:block;margin-bottom:2px}
    @media(max-width:680px){main{width:calc(100% - 20px);margin:10px auto;padding:20px 16px}.route{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stop::after{display:none!important}.facts{grid-template-columns:1fr;gap:14px}.map{height:340px}}@media(prefers-color-scheme:dark){:root{--bg:#191919;--surface:#232323;--text:#f1f1ef;--muted:#aaa9a5;--border:#41413e;--active:#30302d;--shadow:none}}
  </style>
</head>
<body><main>
  <header><div><h1>Kyrgyzstan · 8D Private Tour</h1><p class="sub">2026/10/2–10/9 · Bishkek 往返</p></div><div class="metrics" aria-label="行程摘要"><span class="badge">健行 4 天</span><span class="badge">騎馬 3 天</span><span class="badge">6 晚住宿</span><span class="badge">USD 2,450</span></div></header>
  <nav class="route" aria-label="八天行程；點選日期查看內容">
    <div class="stop"><button class="day" data-day="0" data-kind="hike" aria-pressed="true"><strong>D1 · Bishkek</strong><span>Ala Archa 往返</span></button></div><div class="stop"><button class="day" data-day="1" data-kind="hike" aria-pressed="false"><strong>D2 · Chong Kemin</strong><span>國家公園</span></button></div><div class="stop"><button class="day" data-day="2" data-kind="hike" aria-pressed="false"><strong>D3 · Bokonbaev</strong><span>湖岸與峽谷</span></button></div><div class="stop"><button class="day" data-day="3" data-kind="hike" aria-pressed="false"><strong>D4 · Jeti Oguz</strong><span>瀑布與紅岩</span></button></div><div class="stop"><button class="day" data-day="4" data-kind="horse" aria-pressed="false"><strong>D5 · Karakol</strong><span>Oguz Bashy</span></button></div><div class="stop"><button class="day" data-day="5" data-kind="horse" aria-pressed="false"><strong>D6 · Altyn Arashan</strong><span>騎馬與溫泉</span></button></div><div class="stop"><button class="day" data-day="6" data-kind="horse" aria-pressed="false"><strong>D7 · Karakol</strong><span>騎馬返回</span></button></div><div class="stop"><button class="day" data-day="7" data-kind="transfer" aria-pressed="false"><strong>D8 · Bishkek</strong><span>經 Cholpon Ata</span></button></div>
  </nav>
  <div class="legend"><span class="key"><span class="dot hike"></span>健行</span><span class="key"><span class="dot horse"></span>騎馬</span><span class="key"><span class="dot"></span>移動日</span></div>
  <section class="map-wrap" aria-label="當日行程地圖"><div class="map-head"><h2 id="mapTitle">D1 地圖 · Bishkek ↔ Ala Archa</h2><span id="mapNote" class="map-note">往返路線 · 點擊標記查看地點</span></div><div id="map" class="map"></div></section>
  <section class="detail" aria-live="polite"><div class="detail-head"><div><h2 id="title">D1｜Ala Archa National Park</h2><p id="routeText" class="route-text">Bishkek → Ala Archa → Bishkek</p></div><span id="date" class="badge">10/2（五）</span></div><div class="facts"><div class="fact"><strong>主要活動</strong><span id="activity">健行 4h</span></div><div class="fact"><strong>交通</strong><span id="drive">車程 1h</span></div><div class="fact"><strong>住宿</strong><span id="stay">Bishkek（自理）</span></div></div></section>
  <footer>Private Horse Riding &amp; Hiking Tour · Kyrgyzstan 2026</footer>
</main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
const days=[['D1｜Ala Archa National Park','Bishkek → Ala Archa → Bishkek','10/2（五）','健行 4h','車程 1h','Bishkek（自理）'],['D2｜Chong Kemin National Park','Bishkek → Chong Kemin','10/3（六）','健行 3h','車程 3h','Guesthouse（含早餐）'],['D3｜Issyk-Kul 南岸','Issyk-Kul → Aksay Canyon → Shatyly → Bokonbaev','10/4（日）','健行 3h','車程 4h','Guesthouse（含早餐）'],['D4｜Fairytale Canyon & Barskoon','Fairytale Canyon → Barskoon Waterfalls → Jeti Oguz','10/5（一）','健行 2h','車程 4h','Guesthouse（含早餐）'],['D5｜Oguz Bashy Peak','Jeti Oguz → Oguz Bashy → Karakol','10/6（二）','騎馬 4h','車程 1h','Guesthouse（含早餐）'],['D6｜Altyn Arashan National Park','Karakol → Altyn Arashan','10/7（三）','騎馬 4h · 溫泉 40min','車程 40min','Guesthouse（含早餐）'],['D7｜返回 Karakol','Altyn Arashan → Karakol','10/8（四）','騎馬 4h','車程 40min','Karakol Guesthouse（含早餐）'],['D8｜Cholpon Ata & Bishkek','Karakol → Cholpon Ata → Bishkek','10/9（五）','行程結束／返程','車程 6h','—']];
const mapDays=[
 {title:'D1 地圖 · Bishkek ↔ Ala Archa',note:'往返路線 · 點擊標記查看地點',kind:'hike',places:[['Bishkek',42.882004,74.582748],['Ala Archa National Park',42.6450,74.4789]]},
 {title:'D2 地圖 · Bishkek → Chong Kemin',note:'依行程順序連線',kind:'hike',places:[['Bishkek',42.882004,74.582748],['Chong Kemin National Park',42.747196,76.004373]]},
 {title:'D3 地圖 · Issyk-Kul 南岸',note:'景點依當日順序連線',kind:'hike',places:[['Ak-Sai Canyon',42.1585,77.3860],['Shatyly Panorama',42.0870,77.0830],['Bokonbaevo',42.117183,76.993107]]},
 {title:'D4 地圖 · 南岸峽谷與瀑布',note:'景點依當日順序連線',kind:'hike',places:[['Bokonbaevo',42.117183,76.993107],['Fairytale Canyon',42.1607,77.3309],['Barskoon Waterfalls',42.0100,77.6072],['Jeti Oguz',42.330759,78.237587]]},
 {title:'D5 地圖 · Oguz Bashy → Karakol',note:'Oguz Bashy 標記為景觀區參考位置',kind:'horse',places:[['Jeti Oguz',42.330759,78.237587],['Oguz Bashy 景觀區',42.2600,78.2200],['Karakol',42.4907,78.3936]]},
 {title:'D6 地圖 · Karakol → Altyn Arashan',note:'騎馬前往 · 景點間以直線示意',kind:'horse',places:[['Karakol',42.4907,78.3936],['Altyn Arashan',42.37303,78.61164]]},
 {title:'D7 地圖 · Altyn Arashan → Karakol',note:'騎馬返回 · 景點間以直線示意',kind:'horse',places:[['Altyn Arashan',42.37303,78.61164],['Karakol',42.4907,78.3936]]},
 {title:'D8 地圖 · Karakol → Bishkek',note:'經 Cholpon Ata 返回 Bishkek',kind:'transfer',places:[['Karakol',42.4907,78.3936],['Cholpon Ata',42.6494,77.0823],['Bishkek',42.882004,74.582748]]}
];
const map=L.map('map',{scrollWheelZoom:false}).setView([42.35,76.8],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);let mapLayer=L.layerGroup().addTo(map);
function showMap(dayIndex){const info=mapDays[dayIndex];mapLayer.clearLayers();document.getElementById('mapTitle').textContent=info.title;document.getElementById('mapNote').textContent=info.note;const color=info.kind==='horse'?'#b66a2c':info.kind==='transfer'?'#6f6f6b':'#2f7d59';const points=info.places.map(place=>[place[1],place[2]]);L.polyline(points,{color,weight:4,opacity:.8,dashArray:dayIndex===0?'8 7':null}).addTo(mapLayer);info.places.forEach((place,index)=>{const icon=L.divIcon({className:'',html:`<div class="map-pin ${info.kind}">${index+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]});L.marker([place[1],place[2]],{icon}).bindPopup(`<strong>${index+1}. ${place[0]}</strong>${info.note}`).addTo(mapLayer)});map.fitBounds(points,{padding:[38,38],maxZoom:11})}
const ids=['title','routeText','date','activity','drive','stay'];document.querySelectorAll('.day').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.day').forEach(item=>item.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');const selected=Number(button.dataset.day);days[selected].forEach((value,index)=>document.getElementById(ids[index]).textContent=value);showMap(selected)}));showMap(0);
</script></body></html>
